<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action Memo Demo</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --ink: #15213b;
        --muted: #65728a;
        --line: #dce3ef;
        --blue: #315efb;
        --blue-soft: #eef2ff;
        --green: #087f5b;
        --green-soft: #e8f8f1;
        --amber: #ae5a00;
        --amber-soft: #fff4e5;
        --shadow: 0 12px 32px rgba(31, 49, 82, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 30px 28px 44px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .device-dot {
        position: relative;
        width: 46px;
        height: 46px;
        border-radius: 8px;
        background: #172a55;
        box-shadow: 0 8px 18px rgba(23, 42, 85, 0.2);
      }

      .device-dot::before {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: #74e3c3;
        box-shadow: 0 0 0 5px rgba(116, 227, 195, 0.14);
      }

      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .status-pill {
        border: 1px solid #bdebd9;
        border-radius: 999px;
        background: var(--green-soft);
        padding: 8px 12px;
        color: var(--green);
        font-size: 14px;
        font-weight: 750;
        white-space: nowrap;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(340px, 390px) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .panel-header {
        padding: 20px 20px 0;
      }

      .panel-title {
        margin: 0 0 6px;
        font-size: 19px;
      }

      .panel-note {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .controls {
        padding: 20px;
        display: grid;
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field label {
        color: #3e4c67;
        font-weight: 650;
        font-size: 14px;
      }

      .input,
      textarea {
        width: 100%;
        border: 1px solid #cbd5e5;
        border-radius: 8px;
        background: #fbfcff;
        color: var(--ink);
        padding: 12px;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(49, 94, 251, 0.14);
        background: #fff;
      }

      textarea {
        min-height: 210px;
        resize: vertical;
        line-height: 1.55;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .btn {
        border: 1px solid #cbd5e5;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        min-height: 40px;
        padding: 0 13px;
        font-weight: 700;
        transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      .btn:hover:not(:disabled) {
        border-color: #9db2df;
        background: #f7f9fd;
        transform: translateY(-1px);
      }

      .btn-primary {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
        box-shadow: 0 7px 15px rgba(49, 94, 251, 0.22);
      }

      .btn-primary:hover:not(:disabled) {
        background: #2449d7;
        border-color: #2449d7;
      }

      .btn-focus {
        border-color: #bdebd9;
        background: var(--green-soft);
        color: var(--green);
      }

      .btn-focus:hover:not(:disabled) {
        border-color: #69cfae;
        background: #dff6ec;
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }

      .markers {
        display: grid;
        gap: 7px;
      }

      .marker {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid #d9e4ff;
        background: var(--blue-soft);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
      }

      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        padding: 12px 18px 0;
        overflow-x: auto;
      }

      .tab {
        border: 0;
        border-bottom: 3px solid transparent;
        border-radius: 0;
        background: transparent;
        padding: 11px 10px;
        color: var(--muted);
        cursor: pointer;
        font-weight: 700;
        white-space: nowrap;
      }

      .tab.active {
        color: var(--blue);
        border-bottom-color: var(--blue);
      }

      .content {
        padding: 20px;
      }

      .hero-metric {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 20px;
      }

      .metric {
        border: 1px solid var(--line);
        border-top: 3px solid var(--blue);
        border-radius: 8px;
        padding: 13px 14px;
        background: #fff;
      }

      .metric strong {
        display: block;
        font-size: 26px;
        line-height: 1.15;
      }

      .metric span {
        color: var(--muted);
        font-size: 13px;
      }

      .task-list,
      .list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .task-card {
        border: 1px solid #d8e0ec;
        border-radius: 8px;
        padding: 16px;
        background: #fff;
        box-shadow: 0 4px 12px rgba(31, 49, 82, 0.04);
      }

      .task-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .task-title {
        margin: 0;
        font-size: 18px;
        line-height: 1.35;
      }

      .badge {
        border-radius: 999px;
        background: var(--amber-soft);
        color: var(--amber);
        padding: 5px 9px;
        font-size: 13px;
        font-weight: 750;
        white-space: nowrap;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin: 13px 0;
        color: var(--muted);
        font-size: 14px;
      }

      .meta b {
        color: #43516d;
        font-weight: 700;
        margin-right: 4px;
      }

      .quote {
        margin: 0;
        border-left: 3px solid #7a9bff;
        background: #f5f7ff;
        padding: 11px 12px;
        color: #46546f;
        line-height: 1.55;
        font-size: 14px;
      }

      .plain-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fff;
        line-height: 1.6;
      }

      .focus-workspace {
        display: grid;
        gap: 18px;
      }

      .focus-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .focus-kicker {
        margin: 0 0 5px;
        color: var(--green);
        font-size: 13px;
        font-weight: 800;
      }

      .focus-heading h2 {
        margin: 0;
        font-size: 22px;
      }

      .focus-query {
        display: grid;
        gap: 8px;
      }

      .focus-query label,
      .focus-source-title {
        color: #3e4c67;
        font-size: 14px;
        font-weight: 700;
      }

      .focus-answer {
        border-left: 4px solid var(--green);
        background: #f2fbf7;
        padding: 18px;
      }

      .focus-answer h3 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      .focus-answer p {
        margin: 0;
        line-height: 1.65;
      }

      .focus-source-list {
        display: grid;
        gap: 10px;
      }

      .focus-source {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
      }

      .focus-source-top,
      .focus-trace-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .focus-source-time {
        color: var(--blue);
        font-size: 13px;
        font-weight: 800;
      }

      .focus-reason {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .focus-search {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .focus-trace {
        border: 1px solid #cce8dc;
        background: #f7fdf9;
        padding: 16px;
      }

      .focus-trace p {
        margin: 10px 0 0;
        line-height: 1.7;
      }

      mark {
        background: #fff2a9;
        color: inherit;
        padding: 0 2px;
      }

      .focus-loading {
        display: grid;
        place-items: center;
        min-height: 250px;
        border: 1px dashed #b9d7ca;
        background: #f7fdf9;
        color: var(--green);
        font-weight: 750;
      }

      .transcript-line {
        border-bottom: 1px solid #edf0f5;
        padding: 10px 0;
        line-height: 1.6;
      }

      .empty {
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 32px 20px;
        text-align: center;
        background: #f9fbff;
      }

      @media (max-width: 900px) {
        .shell {
          padding: 20px 16px 32px;
        }

        .grid,
        .hero-metric {
          grid-template-columns: 1fr;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (max-width: 560px) {
        h1 {
          font-size: 27px;
        }

        .panel-header,
        .controls,
        .content {
          padding-left: 16px;
          padding-right: 16px;
        }

        .tabs {
          padding-left: 12px;
          padding-right: 12px;
        }

        .button-row .btn {
          flex: 1 1 calc(50% - 4px);
        }

        .button-row .btn-primary {
          flex-basis: 100%;
        }

        .task-top {
          gap: 8px;
        }

        .focus-heading,
        .focus-source-top,
        .focus-trace-top {
          align-items: flex-start;
          flex-direction: column;
        }

        .focus-search {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="device-dot" aria-hidden="true"></div>
          <div>
            <h1>Action Memo</h1>
            <p class="subtitle">录音豆 · 你的下一步行动，一眼看清</p>
          </div>
        </div>
        <div class="status-pill">设备状态：录音豆在线</div>
      </header>

      <main class="grid">
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">会议输入</h2>
            <p class="panel-note">配置 API Key 后可识别真实录音；未配置时自动使用黑客松模拟结果。</p>
          </div>
          <div class="controls">
            <div class="field">
              <label for="user">当前用户</label>
              <input class="input" id="user" placeholder="例如：小万" />
            </div>

            <div class="field">
              <label for="audio">录音文件</label>
              <input class="input" id="audio" type="file" accept="audio/*,video/mp4,.mp3,.mp4,.mpeg,.mpga,.m4a,.wav,.webm" />
            </div>

            <div class="field">
              <label for="transcript">会议转写</label>
              <textarea id="transcript" placeholder="可选：粘贴会议文字后会直接生成纪要；上传录音时留空即可。"></textarea>
            </div>

            <div class="button-row">
              <button class="btn btn-primary" id="analyzeBtn" type="button">生成我的纪要</button>
              <button class="btn btn-focus" id="focusBtn" type="button">个人重点</button>
              <button class="btn" id="pauseBtn" type="button" disabled>暂停生成</button>
              <button class="btn" id="sampleBtn" type="button">加载测试转写</button>
              <button class="btn" id="markBtn" type="button">添加重点标记</button>
            </div>
            <p class="panel-note" id="generationStatus" aria-live="polite"></p>

            <div class="markers" id="markers"></div>
          </div>
        </section>

        <section class="panel">
          <div class="tabs">
            <button class="tab active" data-tab="actions" type="button">我的待办</button>
            <button class="tab" data-tab="focus" type="button">个人重点</button>
            <button class="tab" data-tab="all-actions" type="button">全部待办</button>
            <button class="tab" data-tab="summary" type="button">会议摘要</button>
            <button class="tab" data-tab="transcript" type="button">全文转写</button>
          </div>
          <div class="content" id="content">
            <div class="empty">上传录音或直接点击生成，查看 Demo 结果。</div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const markers = [];
      let result = null;
      let resultUser = "";
      let activeTab = "actions";
      let editingTaskKey = "";
      let analysisController = null;
      let focusResult = null;
      let focusQuery = "";
      let focusTrace = null;
      let focusMessage = "";
      let focusLoading = false;
      let focusController = null;

      const content = document.querySelector("#content");
      const markersEl = document.querySelector("#markers");
      const analyzeBtn = document.querySelector("#analyzeBtn");
      const markBtn = document.querySelector("#markBtn");
      const sampleBtn = document.querySelector("#sampleBtn");
      const focusBtn = document.querySelector("#focusBtn");
      const pauseBtn = document.querySelector("#pauseBtn");
      const generationStatus = document.querySelector("#generationStatus");

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function nextTimestamp() {
        const seconds = 65 + markers.length * 30;
        return `${pad(Math.floor(seconds / 60))}:${pad(seconds % 60)}`;
      }

      function renderMarkers() {
        markersEl.innerHTML = markers
          .map(
            (marker) => `
              <div class="marker">
                <strong>${marker.time}</strong>
                <span>${marker.note}</span>
              </div>
            `,
          )
          .join("");
      }

      function taskKey(task) {
        return `${task.task}|${task.assignee}|${task.source}`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function activateTab(tabName) {
        activeTab = tabName;
        document.querySelectorAll(".tab").forEach((item) => {
          item.classList.toggle("active", item.dataset.tab === tabName);
        });
        render();
      }

      function compactText(value) {
        return String(value || "").replace(/[\s，。、“”"'：:；;,.!?！？]/g, "");
      }

      function highlightText(text, query) {
        let highlighted = escapeHtml(text);
        const fragments = String(query || "")
          .split(/[，。；、\s!?！？]+/)
          .filter((fragment) => fragment.length >= 3)
          .sort((left, right) => right.length - left.length);
        fragments.forEach((fragment) => {
          const safeFragment = escapeHtml(fragment);
          highlighted = highlighted.replaceAll(safeFragment, `<mark>${safeFragment}</mark>`);
        });
        return highlighted;
      }

      function findTranscriptTrace(query) {
        const lines = document.querySelector("#transcript").value.split(/\r?\n/);
        const queryKey = compactText(query);
        if (queryKey.length < 3) return null;

        let source = "会议转写";
        let bestMatch = null;
        lines.forEach((rawLine) => {
          const line = rawLine.trim();
          if (!line) return;
          const timestamp = line.match(/^(\d{1,2}:\d{2}(?::\d{2})?)/);
          if (timestamp) source = timestamp[1];
          const lineKey = compactText(line);
          if (lineKey.length < 3) return;
          const overlap = [...new Set(queryKey)].filter((character) => lineKey.includes(character)).length;
          const score = (lineKey.includes(queryKey) || queryKey.includes(lineKey) ? 100 : 0) + overlap / queryKey.length;
          if (!bestMatch || score > bestMatch.score) bestMatch = { source, evidence: line, score };
        });
        return bestMatch && bestMatch.score > 0.18 ? bestMatch : null;
      }

      function renderFocusWorkspace() {
        const sourceCards = (focusResult?.sources || [])
          .map((source, index) => `
            <article class="focus-source">
              <div class="focus-source-top">
                <span class="focus-source-time">原文依据｜${escapeHtml(source.source)}</span>
                <button class="btn" type="button" data-focus-action="trace-source" data-source-index="${index}">查看原文</button>
              </div>
              <p class="quote" style="margin-top: 10px">${escapeHtml(source.evidence)}</p>
              ${source.reason ? `<p class="focus-reason">${escapeHtml(source.reason)}</p>` : ""}
            </article>
          `)
          .join("");

        const output = focusLoading
          ? `<div class="focus-loading">正在定位与你有关的重点和原文依据...</div>`
          : focusResult
            ? `
              <section class="focus-answer">
                <div class="focus-source-top">
                  <span class="focus-kicker">个人重点输出</span>
                  <button class="btn" type="button" data-focus-action="copy-answer">复制重点</button>
                </div>
                <h3>${escapeHtml(focusResult.title)}</h3>
                <p>${escapeHtml(focusResult.answer)}</p>
              </section>
              <section class="focus-source-list">
                <div class="focus-source-title">原文依据</div>
                ${sourceCards || '<div class="empty">暂未定位到可复查的原文依据。</div>'}
              </section>
              <section class="focus-query">
                <label for="traceQuery">复查索引</label>
                <div class="focus-search">
                  <input class="input" id="traceQuery" placeholder="输入一句话或粘贴一段原文，定位对应内容" />
                  <button class="btn" type="button" data-focus-action="search-trace">检索原文</button>
                </div>
              </section>
              ${focusTrace ? `
                <section class="focus-trace">
                  <div class="focus-trace-top">
                    <span class="focus-source-time">原文溯源｜${escapeHtml(focusTrace.source)}</span>
                    <button class="btn" type="button" data-focus-action="copy-trace">复制原文</button>
                  </div>
                  <p>${highlightText(focusTrace.evidence, focusTrace.query || focusQuery)}</p>
                </section>
              ` : ""}
            `
            : '<div class="empty">输入一个你最关心的问题。生成后，答案会附带可复查的原文依据。</div>';

        return `
          <div class="focus-workspace">
            <div class="focus-heading">
              <div>
                <p class="focus-kicker">个人重点</p>
                <h2>这场沟通里，你最想弄清什么？</h2>
              </div>
            </div>
            <section class="focus-query">
              <label for="focusQuery">输入重点</label>
              <textarea id="focusQuery" placeholder="例如：我接下来要准备什么？客户对方案最在意的是什么？">${escapeHtml(focusQuery)}</textarea>
              <div class="button-row">
                <button class="btn btn-primary" type="button" data-focus-action="generate" ${focusLoading ? "disabled" : ""}>生成个人重点</button>
                ${focusLoading ? '<button class="btn" type="button" data-focus-action="cancel">暂停生成</button>' : ""}
              </div>
              ${focusMessage ? `<p class="panel-note">${escapeHtml(focusMessage)}</p>` : ""}
            </section>
            ${output}
          </div>
        `;
      }

      function updateTaskStatus(key, status) {
        if (!result) return;

        ["my_tasks", "all_tasks"].forEach((field) => {
          (result[field] || []).forEach((task) => {
            if (taskKey(task) === key) {
              task.status = status;
            }
          });
        });

        render();
      }

      function updateTaskFields(key, fields) {
        if (!result) return;

        ["my_tasks", "all_tasks"].forEach((field) => {
          (result[field] || []).forEach((task) => {
            if (taskKey(task) === key) {
              Object.assign(task, fields);
            }
          });
        });

        editingTaskKey = "";
        render();
      }

      function render() {
        if (activeTab === "focus") {
          content.innerHTML = renderFocusWorkspace();
          return;
        }
        if (!result) {
          content.innerHTML = '<div class="empty">上传录音或直接点击生成，查看 Demo 结果。</div>';
          return;
        }
        if (Array.isArray(result.all_tasks)) {
          result.my_tasks = result.all_tasks.filter((task) =>
            task.assignee.split(/[、，,和与及\s]+/).includes(resultUser),
          );
        }

        function taskCards(tasks) {
          if (!tasks || tasks.length === 0) {
            return '<div class="empty">没有识别到明确待办。</div>';
          }

          return tasks
            .map(
              (task) => {
                const key = taskKey(task);
                const isEditing = editingTaskKey === key;

                return `
                <article class="task-card">
                  <div class="task-top">
                    <h3 class="task-title">${task.task}</h3>
                    <span class="badge">${task.status}</span>
                  </div>
                  <div class="meta">
                    <span><b>负责人</b>${task.assignee}</span>
                    <span><b>截止</b>${task.deadline}</span>
                    <span><b>置信度</b>${Math.round(task.confidence * 100)}%</span>
                  </div>
                  <p class="quote"><strong>来源片段｜${task.source}</strong><br>${task.evidence}</p>
                  ${
                    isEditing
                      ? `
                        <div class="field" style="margin-top: 12px">
                          <label>负责人</label>
                          <input class="input" data-edit-field="assignee" data-task-key="${key}" value="${task.assignee}" />
                        </div>
                        <div class="field" style="margin-top: 12px">
                          <label>截止时间</label>
                          <input class="input" data-edit-field="deadline" data-task-key="${key}" value="${task.deadline}" />
                        </div>
                      `
                      : ""
                  }
                  <div class="button-row" style="margin-top: 12px">
                    ${
                      isEditing
                        ? `<button class="btn" type="button" data-task-action="save" data-task-key="${key}">保存</button>
                           <button class="btn" type="button" data-task-action="cancel-edit" data-task-key="${key}">取消</button>`
                        : `<button class="btn" type="button" data-task-action="confirm" data-task-key="${key}">确认任务</button>
                           <button class="btn" type="button" data-task-action="edit" data-task-key="${key}">修改</button>
                           <button class="btn" type="button" data-task-action="ignore" data-task-key="${key}">忽略</button>`
                    }
                  </div>
                </article>
              `;
              },
            )
            .join("");
        }

        function insightCards(items) {
          if (!items || items.length === 0) {
            return "";
          }

          return items
            .map(
              (item) => `
                <div class="plain-card">
                  <strong>${item.title}</strong>
                  <p class="panel-note" style="margin-top: 6px">来源片段｜${item.source}</p>
                  <p style="margin: 8px 0 0">${item.evidence}</p>
                </div>
              `,
            )
            .join("");
        }

        if (activeTab === "actions" || activeTab === "all-actions") {
          const tasks = activeTab === "actions" ? result.my_tasks : (result.all_tasks || result.my_tasks);
          const title = activeTab === "actions" ? "我的待办" : "全部待办";
          content.innerHTML = `
            <div class="hero-metric">
              <div class="metric"><strong>${result.my_tasks.length}</strong><span>我的待办</span></div>
              <div class="metric"><strong>${(result.all_tasks || result.my_tasks).length}</strong><span>全部待办</span></div>
              <div class="metric"><strong>${result.risks.length}</strong><span>风险提醒</span></div>
            </div>
            <h2 class="panel-title">${result.meeting_title}</h2>
            <p class="panel-note">${result.demo_mode ? "当前显示本地规则解析结果，请核对任务。" : "已使用 AI 分析会议内容。"}</p>
            <h3>${title}</h3>
            <div class="task-list">
              ${taskCards(tasks)}
            </div>
          `;
          return;
        }

        if (activeTab === "summary") {
          content.innerHTML = `
            <h2 class="panel-title">${result.meeting_title}</h2>
            <p class="panel-note">${result.demo_mode ? "当前显示本地规则解析结果，请核对任务。" : "已使用 AI 分析会议内容。"}</p>
            <p class="plain-card">${result.summary}</p>
            <h3>关键决策</h3>
            <div class="list">${result.decisions.map((item) => `<div class="plain-card">${item}</div>`).join("")}</div>
            ${(result.questions || []).length ? `<h3>待确认问题</h3><div class="list">${insightCards(result.questions)}</div>` : ""}
            ${(result.evidence_notes || []).length ? `<h3>背景证据</h3><div class="list">${insightCards(result.evidence_notes)}</div>` : ""}
            <h3>风险提醒</h3>
            <div class="list">${result.risks.map((item) => `<div class="plain-card">${item}</div>`).join("")}</div>
          `;
          return;
        }

        content.innerHTML = `
          <h2 class="panel-title">全文转写</h2>
          ${(result.transcript || []).map((line) => `<div class="transcript-line">${line}</div>`).join("")}
        `;
      }

      markBtn.addEventListener("click", () => {
        markers.push({
          label: "重点标记",
          time: nextTimestamp(),
          note: markers.length % 2 === 0 ? "硬件按钮模拟：这里很重要" : "跟我相关的任务",
        });
        renderMarkers();
      });

      sampleBtn.addEventListener("click", async () => {
        sampleBtn.disabled = true;
        sampleBtn.textContent = "加载中...";

        try {
          const response = await fetch("/static/samples/recording-bean-preliminary-meeting.txt");
          if (!response.ok) throw new Error("测试转写加载失败");
          document.querySelector("#transcript").value = await response.text();
          document.querySelector("#user").focus();
        } finally {
          sampleBtn.disabled = false;
          sampleBtn.textContent = "加载测试转写";
        }
      });

      analyzeBtn.addEventListener("click", async () => {
        analysisController = new AbortController();
        analyzeBtn.disabled = true;
        analyzeBtn.textContent = "分析中...";
        pauseBtn.disabled = false;
        generationStatus.textContent = "正在生成，可暂停后修改输入。";

        const formData = new FormData();
        const audio = document.querySelector("#audio").files[0];
        if (audio) formData.append("audio", audio);
        formData.append("transcript", document.querySelector("#transcript").value);
        const analysisUser = document.querySelector("#user").value.trim();
        formData.append("current_user", analysisUser);
        formData.append("markers", JSON.stringify(markers));

        try {
          const response = await fetch("/api/meetings/analyze", {
            method: "POST",
            body: formData,
            signal: analysisController.signal,
          });
          if (!response.ok) throw new Error("会议分析失败");
          result = await response.json();
          resultUser = analysisUser;
          render();
          generationStatus.textContent = "";
        } catch (error) {
          if (error.name === "AbortError") {
            generationStatus.textContent = "已暂停生成。修改输入后可重新生成。";
          } else {
            generationStatus.textContent = "生成失败，请检查输入或网络后重试。";
          }
        } finally {
          analyzeBtn.disabled = false;
          analyzeBtn.textContent = "生成我的纪要";
          pauseBtn.disabled = true;
          analysisController = null;
        }
      });

      pauseBtn.addEventListener("click", () => {
        analysisController?.abort();
      });

      focusBtn.addEventListener("click", () => {
        activateTab("focus");
        content.querySelector("#focusQuery")?.focus();
      });

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          activateTab(tab.dataset.tab);
        });
      });

      content.addEventListener("click", (event) => {
        const focusActionButton = event.target.closest("[data-focus-action]");
        if (focusActionButton) {
          const focusAction = focusActionButton.dataset.focusAction;
          focusQuery = content.querySelector("#focusQuery")?.value.trim() || focusQuery;

          if (focusAction === "cancel") {
            focusController?.abort();
            return;
          }

          if (focusAction === "copy-answer" && focusResult) {
            navigator.clipboard.writeText(focusResult.answer).then(() => {
              focusMessage = "个人重点已复制。";
              render();
            });
            return;
          }

          if (focusAction === "copy-trace" && focusTrace) {
            navigator.clipboard.writeText(focusTrace.evidence).then(() => {
              focusMessage = "原文已复制。";
              render();
            });
            return;
          }

          if (focusAction === "trace-source" && focusResult) {
            const source = focusResult.sources[Number(focusActionButton.dataset.sourceIndex)];
            if (source) {
              focusTrace = { ...source, query: source.evidence };
              focusMessage = "已定位到这条原文。";
              render();
            }
            return;
          }

          if (focusAction === "search-trace") {
            const traceQuery = content.querySelector("#traceQuery")?.value.trim() || "";
            const match = findTranscriptTrace(traceQuery);
            if (match) {
              focusTrace = { ...match, query: traceQuery };
              focusMessage = "已找到最相关的原文片段。";
            } else {
              focusMessage = "没有找到足够相关的原文，请换一个更短的关键词或句子。";
            }
            render();
            return;
          }

          if (focusAction === "generate") {
            const transcript = document.querySelector("#transcript").value.trim();
            if (!transcript) {
              focusMessage = "请先粘贴会议转写、上传录音，或加载测试转写。";
              render();
              return;
            }
            if (!focusQuery) {
              focusMessage = "请输入你最关心的问题。";
              render();
              return;
            }

            focusLoading = true;
            focusMessage = "";
            focusResult = null;
            focusTrace = null;
            focusController = new AbortController();
            render();

            const formData = new FormData();
            formData.append("transcript", transcript);
            formData.append("current_user", document.querySelector("#user").value.trim());
            formData.append("focus_query", focusQuery);

            fetch("/api/meetings/focus", {
              method: "POST",
              body: formData,
              signal: focusController.signal,
            })
              .then(async (response) => {
                if (!response.ok) throw new Error("个人重点生成失败");
                return response.json();
              })
              .then((data) => {
                focusResult = data;
                focusTrace = data.sources?.[0] || null;
              })
              .catch((error) => {
                focusMessage = error.name === "AbortError"
                  ? "已暂停生成。修改重点后可重新生成。"
                  : "生成失败，请检查网络或稍后重试。";
              })
              .finally(() => {
                focusLoading = false;
                focusController = null;
                render();
              });
            return;
          }
        }

        const button = event.target.closest("[data-task-action]");
        if (!button) return;

        const action = button.dataset.taskAction;
        const key = button.dataset.taskKey;

        if (action === "confirm" || action === "ignore") {
          updateTaskStatus(key, action === "confirm" ? "已确认" : "已忽略");
          return;
        }

        if (action === "edit") {
          editingTaskKey = key;
          render();
          return;
        }

        if (action === "cancel-edit") {
          editingTaskKey = "";
          render();
          return;
        }

        if (action === "save") {
          const assignee = content.querySelector(`[data-edit-field="assignee"][data-task-key="${key}"]`)?.value || "待确认";
          const deadline = content.querySelector(`[data-edit-field="deadline"][data-task-key="${key}"]`)?.value || "待确认";
          updateTaskFields(key, { assignee, deadline, status: "已修改" });
        }
      });
    </script>
  </body>
</html>
