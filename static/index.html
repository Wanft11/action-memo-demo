<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action Memo Demo</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --panel: #ffffff;
        --ink: #1f2329;
        --muted: #646a73;
        --line: #e5e8ed;
        --blue: #3370ff;
        --blue-soft: #edf3ff;
        --green: #16a77a;
        --green-soft: #ecfaf5;
        --amber: #d46b08;
        --amber-soft: #fff7e8;
        --violet: #7b61ff;
        --shadow: 0 8px 24px rgba(31, 35, 41, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .shell {
        max-width: 1360px;
        margin: 0 auto;
        padding: 24px 28px 48px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
        padding: 4px 2px 18px;
        border-bottom: 1px solid #e9ebf0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .device-dot {
        position: relative;
        width: 42px;
        height: 42px;
        border-radius: 8px;
        background: linear-gradient(135deg, #5b8cff 0%, #7165ff 55%, #3bc4aa 100%);
        box-shadow: 0 8px 18px rgba(51, 112, 255, 0.22);
      }

      .device-dot::before {
        content: "";
        position: absolute;
        inset: 11px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.22);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 7px 0 0;
        color: #7b818b;
        font-size: 14px;
      }

      .status-pill {
        border: 0;
        border-radius: 999px;
        background: linear-gradient(100deg, #e8f7ff, #edf7f2);
        padding: 8px 13px;
        color: #267a5f;
        font-size: 13px;
        font-weight: 750;
        white-space: nowrap;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(340px, 390px) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid #e7e9ee;
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .panel-header {
        padding: 22px 22px 0;
      }

      .panel-title {
        margin: 0 0 6px;
        font-size: 18px;
      }

      .panel-note {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .controls {
        padding: 22px;
        display: grid;
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field label {
        color: #42464e;
        font-weight: 700;
        font-size: 14px;
      }

      .input,
      textarea {
        width: 100%;
        border: 1px solid #dfe3ea;
        border-radius: 8px;
        background: #fafbfc;
        color: var(--ink);
        padding: 12px;
        transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }

      .input:focus,
      textarea:focus {
        outline: none;
        border-color: #82a7ff;
        box-shadow: 0 0 0 3px rgba(51, 112, 255, 0.12);
        background: #fff;
      }

      textarea {
        min-height: 210px;
        resize: vertical;
        line-height: 1.55;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }

      .btn {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #fff;
        color: #373c45;
        cursor: pointer;
        min-height: 40px;
        padding: 0 13px;
        font-weight: 700;
        transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .btn::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0;
        background: linear-gradient(105deg, transparent 25%, rgba(255, 255, 255, 0.55) 48%, transparent 72%);
        transform: translateX(-130%);
      }

      .btn:hover:not(:disabled) {
        border-color: #bfc9da;
        background: #f7f8fa;
        box-shadow: 0 4px 10px rgba(31, 35, 41, 0.06);
        transform: translateY(-1px);
      }

      .btn.is-pressed {
        transform: scale(0.97);
      }

      .btn.is-pressed::after {
        opacity: 1;
        animation: button-sweep 420ms ease-out;
      }

      .btn-primary {
        border-color: transparent;
        background: linear-gradient(100deg, #3370ff 0%, #5c77ff 48%, #7a61ff 100%);
        background-size: 160% 100%;
        color: #fff;
        box-shadow: 0 8px 16px rgba(62, 100, 255, 0.22);
      }

      .btn-primary:hover:not(:disabled) {
        background-position: 100% 0;
        border-color: transparent;
        box-shadow: 0 9px 18px rgba(62, 100, 255, 0.28);
      }

      .btn-focus {
        border-color: #c7ebde;
        background: linear-gradient(105deg, #effbf7, #eaf8ff);
        color: #17856a;
      }

      .btn-focus:hover:not(:disabled) {
        border-color: #92d8c2;
        background: linear-gradient(105deg, #e4f8f0, #e3f3ff);
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }

      .markers {
        display: grid;
        gap: 7px;
      }

      .marker {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid #dce6ff;
        background: #f5f8ff;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
      }

      .device-marker-summary {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        border-left: 3px solid #6e77ff;
        background: linear-gradient(100deg, #f4f5ff, #f5fbff);
        padding: 9px 11px;
        color: #4b5672;
        font-size: 13px;
        line-height: 1.45;
      }

      .device-marker-summary strong {
        color: #5b63d8;
      }

      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--line);
        padding: 12px 16px 0;
        overflow-x: auto;
      }

      .tab {
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 6px 6px 0 0;
        background: transparent;
        padding: 10px 12px;
        color: var(--muted);
        cursor: pointer;
        font-weight: 700;
        transition: color 160ms ease, background 160ms ease, transform 160ms ease;
        white-space: nowrap;
      }

      .tab.active {
        color: #2f65ef;
        border-bottom-color: #4d7bff;
        background: linear-gradient(180deg, #f5f8ff, rgba(245, 248, 255, 0));
      }

      .tab:hover {
        color: #3f68d8;
        background: #f7f9fd;
      }

      .content {
        padding: 22px;
      }

      .hero-metric {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 22px;
      }

      .metric {
        border: 1px solid #e7e9ee;
        border-top: 3px solid #5c83ff;
        border-radius: 8px;
        padding: 14px 15px;
        background: linear-gradient(150deg, #fff, #fafbff);
      }

      .metric strong {
        display: block;
        font-size: 25px;
        line-height: 1.15;
      }

      .metric span {
        color: var(--muted);
        font-size: 13px;
      }

      .metric:nth-child(2) {
        border-top-color: #38b692;
        background: linear-gradient(150deg, #fff, #f7fcfa);
      }

      .metric:nth-child(3) {
        border-top-color: #f0a24b;
        background: linear-gradient(150deg, #fff, #fffbf5);
      }

      .task-list,
      .list {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }

      .task-card {
        border: 1px solid #e2e6ed;
        border-radius: 8px;
        padding: 17px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(31, 35, 41, 0.03);
        transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
      }

      .task-card:hover {
        border-color: #cbd8f7;
        box-shadow: 0 9px 20px rgba(51, 112, 255, 0.08);
        transform: translateY(-2px);
      }

      .task-triage-note {
        margin: 0 0 16px;
        border-left: 4px solid #4f9dff;
        background: linear-gradient(110deg, #f3f8ff, #f6fcfa);
        padding: 13px 14px;
        color: #31536a;
        line-height: 1.55;
      }

      .library-list {
        display: grid;
        gap: 10px;
      }

      .library-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        border: 1px solid #e3e7ee;
        border-radius: 8px;
        background: #fff;
        transition: box-shadow 160ms ease, border-color 160ms ease;
      }

      .library-item:hover {
        border-color: #cdd9f4;
        box-shadow: 0 6px 16px rgba(31, 35, 41, 0.05);
        padding: 14px;
      }

      .library-item-main {
        display: flex;
        min-width: 0;
        align-items: flex-start;
        gap: 12px;
      }

      .library-type {
        display: grid;
        flex: 0 0 36px;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 8px;
        background: linear-gradient(145deg, #e9f1ff, #f0edff);
        color: #4b6fe8;
        font-size: 14px;
        font-weight: 800;
      }

      .library-item-copy {
        min-width: 0;
      }

      .library-item h3 {
        margin: 0 0 5px;
        font-size: 16px;
      }

      .library-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .library-stat {
        border-radius: 999px;
        background: #f2f5fb;
        color: #5c6676;
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 700;
      }

      .library-toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        margin: 16px 0;
      }

      .folder-select-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .folder-hint {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .folder-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin: 16px 0 20px;
      }

      .folder-card {
        display: grid;
        gap: 6px;
        min-height: 116px;
        border: 1px solid #e2e7f0;
        border-radius: 8px;
        background: #fff;
        padding: 14px;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
        transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }

      .folder-card:hover,
      .folder-card.active {
        border-color: #90afff;
        box-shadow: 0 8px 18px rgba(51, 112, 255, 0.09);
        transform: translateY(-1px);
      }

      .folder-card.active {
        background: linear-gradient(130deg, #f5f8ff, #f4fcf9);
      }

      .folder-card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .folder-card strong {
        font-size: 15px;
      }

      .folder-card span,
      .folder-card small {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .profile-list {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }

      .task-decision {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .task-decision-note {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .btn-claim {
        border-color: transparent;
        background: linear-gradient(105deg, #36b995, #57c6a6);
        color: #fff;
      }

      .btn-claim:hover:not(:disabled) {
        border-color: transparent;
        background: linear-gradient(105deg, #209f7d, #42b993);
      }

      .task-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .task-title {
        margin: 0;
        font-size: 18px;
        line-height: 1.35;
      }

      .badge {
        border-radius: 999px;
        background: linear-gradient(105deg, #fff5e8, #fff8f0);
        color: #c66a10;
        padding: 5px 9px;
        font-size: 13px;
        font-weight: 750;
        white-space: nowrap;
        transition: background 280ms ease, color 280ms ease, box-shadow 280ms ease, transform 280ms ease;
      }

      .badge--confirmed {
        background: linear-gradient(105deg, #dcf8ee, #eefcf5);
        color: #16785d;
        box-shadow: 0 4px 12px rgba(27, 166, 121, 0.13);
      }

      .badge--cancelled {
        background: linear-gradient(105deg, #fff0f0, #fff8f3);
        color: #bd4a4a;
        box-shadow: 0 4px 12px rgba(208, 83, 83, 0.1);
      }

      .badge--muted {
        background: #f3f5f8;
        color: #727a88;
      }

      .task-card--confirmed {
        border-color: #b9e5d5;
        background: linear-gradient(115deg, #ffffff 0%, #fbfffd 100%);
        animation: task-confirmed 440ms ease-out;
      }

      .task-card--cancelled {
        border-color: #f0d4d4;
        background: linear-gradient(115deg, #ffffff 0%, #fffafa 100%);
        animation: task-cancelled 440ms ease-out;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin: 13px 0;
        color: var(--muted);
        font-size: 14px;
      }

      .meta b {
        color: #555d6d;
        font-weight: 700;
        margin-right: 4px;
      }

      .quote {
        margin: 0;
        border-left: 3px solid #79a2ff;
        background: #f7f9fe;
        padding: 11px 12px;
        color: #566174;
        line-height: 1.55;
        font-size: 14px;
      }

      .plain-card {
        border: 1px solid #e4e7ed;
        border-radius: 8px;
        padding: 14px;
        background: #fff;
        line-height: 1.6;
      }

      .focus-workspace {
        display: grid;
        gap: 18px;
      }

      .focus-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .focus-kicker {
        margin: 0 0 5px;
        color: #2a9c80;
        font-size: 13px;
        font-weight: 800;
      }

      .focus-heading h2 {
        margin: 0;
        font-size: 22px;
      }

      .focus-query {
        display: grid;
        gap: 8px;
      }

      .focus-query label,
      .focus-source-title {
        color: #3e4c67;
        font-size: 14px;
        font-weight: 700;
      }

      .focus-answer {
        border-left: 4px solid #45b895;
        background: linear-gradient(120deg, #effbf7, #f4f9ff);
        padding: 18px;
      }

      .focus-answer h3 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      .focus-answer p {
        margin: 0;
        line-height: 1.65;
      }

      .focus-source-list {
        display: grid;
        gap: 10px;
      }

      .focus-source {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
      }

      .focus-source-top,
      .focus-trace-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .focus-source-time {
        color: #4b74e8;
        font-size: 13px;
        font-weight: 800;
      }

      .focus-reason {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .focus-search {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .focus-trace {
        border: 1px solid #d7eee5;
        background: #f7fdfb;
        padding: 16px;
      }

      .focus-trace p {
        margin: 10px 0 0;
        line-height: 1.7;
      }

      mark {
        background: #fff2a9;
        color: inherit;
        padding: 0 2px;
      }

      .focus-loading {
        display: grid;
        place-items: center;
        min-height: 250px;
        border: 1px dashed #a9d6c6;
        background: linear-gradient(135deg, #f7fdf9, #f5f8ff);
        color: #258d72;
        font-weight: 750;
      }

      .transcript-line {
        border-bottom: 1px solid #edf0f5;
        padding: 10px 0;
        line-height: 1.6;
      }

      .transcript-line--marked {
        margin: 7px 0;
        border: 1px solid #cfd6ff;
        border-left: 4px solid #7179ff;
        border-radius: 8px;
        background: linear-gradient(105deg, #f6f5ff, #f4fbff);
        padding: 12px;
      }

      .transcript-marker-label {
        display: inline-block;
        margin: 0 0 6px;
        border-radius: 999px;
        background: #e5e7ff;
        color: #555dc8;
        padding: 3px 7px;
        font-size: 12px;
        font-weight: 750;
      }

      .empty {
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 32px 20px;
        text-align: center;
        background: #fbfcff;
      }

      .sample-dialog {
        width: min(620px, calc(100% - 32px));
        border: 1px solid #e1e5ed;
        border-radius: 8px;
        padding: 0;
        box-shadow: 0 24px 64px rgba(31, 35, 41, 0.2);
      }

      .sample-dialog::backdrop {
        background: rgba(31, 35, 41, 0.32);
        backdrop-filter: blur(2px);
      }

      .sample-dialog[open] {
        animation: dialog-enter 180ms ease-out;
      }

      .sample-dialog-content {
        padding: 22px;
      }

      .sample-dialog-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .sample-dialog-title {
        margin: 0 0 5px;
        font-size: 20px;
      }

      .sample-option-list {
        display: grid;
        gap: 9px;
      }

      .sample-option {
        display: grid;
        width: 100%;
        gap: 4px;
        border: 1px solid #e1e6ef;
        border-radius: 8px;
        background: #fff;
        padding: 14px;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
        transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }

      .sample-option:hover {
        border-color: #9eb8ff;
        background: linear-gradient(110deg, #f7f9ff, #f7fdfb);
        box-shadow: 0 8px 18px rgba(51, 112, 255, 0.08);
        transform: translateY(-1px);
      }

      .sample-option strong {
        font-size: 16px;
      }

      .sample-option span {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      @keyframes button-sweep {
        from { transform: translateX(-130%); }
        to { transform: translateX(130%); }
      }

      @keyframes task-confirmed {
        0% { border-color: #c4d3f7; background: #fff; transform: scale(0.99); }
        55% { border-color: #75d0af; background: linear-gradient(115deg, #f5fff9, #f0fcf6); }
        100% { transform: scale(1); }
      }

      @keyframes task-cancelled {
        0% { border-color: #c4d3f7; background: #fff; transform: scale(0.99); }
        55% { border-color: #e6abab; background: linear-gradient(115deg, #fff8f8, #fffdfb); }
        100% { transform: scale(1); }
      }

      @keyframes dialog-enter {
        from { opacity: 0; transform: translateY(8px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-width: 900px) {
        .shell {
          padding: 20px 16px 32px;
        }

        .grid,
        .hero-metric {
          grid-template-columns: 1fr;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (max-width: 560px) {
        h1 {
          font-size: 27px;
        }

        .panel-header,
        .controls,
        .content {
          padding-left: 16px;
          padding-right: 16px;
        }

        .tabs {
          padding-left: 12px;
          padding-right: 12px;
        }

        .button-row .btn {
          flex: 1 1 calc(50% - 4px);
        }

        .button-row .btn-primary {
          flex-basis: 100%;
        }

        .task-top {
          gap: 8px;
        }

        .focus-heading,
        .focus-source-top,
        .focus-trace-top {
          align-items: flex-start;
          flex-direction: column;
        }

        .focus-search {
          grid-template-columns: 1fr;
        }

        .library-item {
          align-items: flex-start;
          flex-direction: column;
        }

        .library-item .btn {
          width: 100%;
        }

        .library-toolbar {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="device-dot" aria-hidden="true"></div>
          <div>
            <h1>Action Memo</h1>
            <p class="subtitle">录音豆 · 你的下一步行动，一眼看清</p>
          </div>
        </div>
        <div class="status-pill">设备状态：录音豆在线</div>
      </header>

      <main class="grid">
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">会议输入</h2>
            <p class="panel-note">配置 API Key 后可识别真实录音；未配置时自动使用黑客松模拟结果。</p>
          </div>
          <div class="controls">
            <div class="field">
              <label for="user">我的账号</label>
              <input class="input" id="user" placeholder="例如：小万" />
            </div>

            <div class="field">
              <label for="folder">保存场景</label>
              <div class="folder-select-row">
                <select class="input" id="folder" disabled>
                  <option>填写账号后加载文件夹</option>
                </select>
                <button class="btn" id="newFolderBtn" type="button" disabled>新建</button>
              </div>
              <p class="folder-hint" id="folderHint">未选择时会自动保存到默认文件夹。</p>
            </div>

            <div class="field">
              <label for="audio">录音文件</label>
              <input class="input" id="audio" type="file" accept="audio/*,video/mp4,.mp3,.mp4,.mpeg,.mpga,.m4a,.wav,.webm" />
            </div>

            <div class="field">
              <label for="transcript">会议转写</label>
              <textarea id="transcript" placeholder="可选：粘贴会议文字后会直接生成纪要；上传录音时留空即可。"></textarea>
            </div>

            <div class="button-row">
              <button class="btn btn-primary" id="analyzeBtn" type="button">生成任务清单</button>
              <button class="btn" id="saveBtn" type="button" disabled>保存到录音库</button>
              <button class="btn btn-focus" id="focusBtn" type="button">个人重点</button>
              <button class="btn" id="pauseBtn" type="button" disabled>暂停生成</button>
              <button class="btn" id="sampleBtn" type="button">加载测试转写</button>
            </div>
            <p class="panel-note" id="generationStatus" aria-live="polite"></p>

            <div class="device-marker-summary" id="markers">录音豆重点会在设备按压后自动同步到这里。</div>
          </div>
        </section>

        <section class="panel">
          <div class="tabs">
            <button class="tab active" data-tab="actions" type="button">我的待办</button>
            <button class="tab" data-tab="task-list" type="button">任务清单</button>
            <button class="tab" data-tab="library" type="button">录音库</button>
            <button class="tab" data-tab="profile" type="button">个人画像</button>
            <button class="tab" data-tab="focus" type="button">个人重点</button>
            <button class="tab" data-tab="all-actions" type="button">全部待办</button>
            <button class="tab" data-tab="summary" type="button">会议摘要</button>
            <button class="tab" data-tab="transcript" type="button">全文转写</button>
          </div>
          <div class="content" id="content">
            <div class="empty">上传录音或直接点击生成，查看 Demo 结果。</div>
          </div>
        </section>
      </main>
    </div>

    <dialog class="sample-dialog" id="sampleDialog" aria-labelledby="sampleDialogTitle">
      <div class="sample-dialog-content">
        <div class="sample-dialog-top">
          <div>
            <h2 class="sample-dialog-title" id="sampleDialogTitle">选择一份测试转写</h2>
            <p class="panel-note">加载后可修改当前用户，或直接生成任务清单。</p>
          </div>
          <button class="btn" type="button" data-sample-action="close" aria-label="关闭测试转写选择">关闭</button>
        </div>
        <div class="sample-option-list" id="sampleOptionList"></div>
      </div>
    </dialog>

    <dialog class="sample-dialog" id="folderDialog" aria-labelledby="folderDialogTitle">
      <form class="sample-dialog-content" id="folderForm">
        <div class="sample-dialog-top">
          <div>
            <h2 class="sample-dialog-title" id="folderDialogTitle">新建场景文件夹</h2>
            <p class="panel-note">同一账号在不同场景下的称呼、关键词和确认记录会分开学习。</p>
          </div>
          <button class="btn" type="button" data-folder-action="close">关闭</button>
        </div>
        <div class="field">
          <label for="folderName">文件夹名称</label>
          <input class="input" id="folderName" required placeholder="例如：家庭生活、客户沟通" />
        </div>
        <div class="field" style="margin-top: 14px">
          <label for="folderKeywords">场景关键词</label>
          <input class="input" id="folderKeywords" placeholder="用顿号或逗号分隔，例如：孩子、家长、周末" />
        </div>
        <div class="field" style="margin-top: 14px">
          <label for="folderAliases">这个场景中对我的称呼</label>
          <input class="input" id="folderAliases" placeholder="用顿号或逗号分隔，例如：爸爸、老万" />
        </div>
        <div class="button-row" style="margin-top: 18px">
          <button class="btn btn-primary" type="submit">创建文件夹</button>
        </div>
      </form>
    </dialog>

    <script>
      const markers = [];
      let result = null;
      let resultUser = "";
      let activeTab = "actions";
      let editingTaskKey = "";
      let analysisController = null;
      let focusResult = null;
      let focusQuery = "";
      let focusTrace = null;
      let focusMessage = "";
      let focusLoading = false;
      let focusController = null;
      let currentMeetingId = "";
      let libraryRecords = [];
      let libraryMessage = "";
      let libraryQuery = "";
      let profile = null;
      let folders = [];
      let selectedFolderId = "";

      const testSamples = [
        {
          file: "recording-bean-preliminary-meeting.txt",
          title: "录音豆预赛方案讨论",
          detail: "10 分钟 · 产品定位、Demo 分工与报名表提醒",
          user: "小万",
          folder: { name: "工作沟通", keywords: ["产品", "Demo", "同事"], aliases: ["万哥"] },
          markers: [
            { time: "08:22", note: "临时报名表提醒" },
            { time: "09:17", note: "会议分工总结" },
          ],
        },
        {
          file: "client-follow-up-meeting.txt",
          title: "客户需求回访",
          detail: "8 分钟 · 客户反馈、报价材料与下次演示安排",
          user: "小万",
          folder: { name: "客户沟通", keywords: ["客户", "报价", "续费"], aliases: ["王老师", "万哥"] },
          markers: [
            { time: "02:35", note: "报价单承诺" },
            { time: "03:50", note: "下次沟通安排" },
          ],
        },
        {
          file: "campus-event-planning.txt",
          title: "家庭周末出行安排",
          detail: "7 分钟 · 出行准备、孩子安排与天气提醒",
          user: "小万",
          folder: { name: "家庭生活", keywords: ["孩子", "家长", "周末"], aliases: ["爸爸", "儿子"] },
          markers: [
            { time: "02:30", note: "孩子的请假提醒" },
            { time: "05:05", note: "家庭准备事项总结" },
          ],
        },
      ];

      const content = document.querySelector("#content");
      const markersEl = document.querySelector("#markers");
      const analyzeBtn = document.querySelector("#analyzeBtn");
      const saveBtn = document.querySelector("#saveBtn");
      const sampleBtn = document.querySelector("#sampleBtn");
      const sampleDialog = document.querySelector("#sampleDialog");
      const sampleOptionList = document.querySelector("#sampleOptionList");
      const folderSelect = document.querySelector("#folder");
      const folderHint = document.querySelector("#folderHint");
      const newFolderBtn = document.querySelector("#newFolderBtn");
      const folderDialog = document.querySelector("#folderDialog");
      const folderForm = document.querySelector("#folderForm");
      const focusBtn = document.querySelector("#focusBtn");
      const pauseBtn = document.querySelector("#pauseBtn");
      const generationStatus = document.querySelector("#generationStatus");

      document.addEventListener("click", (event) => {
        const pressed = event.target.closest(".btn, .tab");
        if (!pressed || pressed.disabled) return;
        pressed.classList.remove("is-pressed");
        void pressed.offsetWidth;
        pressed.classList.add("is-pressed");
        setTimeout(() => pressed.classList.remove("is-pressed"), 440);
      });

      function renderMarkers() {
        if (!markers.length) {
          markersEl.textContent = "本次尚未收到录音豆重点事件。设备按压后会自动标出对应转写片段。";
          return;
        }
        markersEl.innerHTML = `<strong>录音豆已标记 ${markers.length} 处重点</strong><span>${markers.map((marker) => escapeHtml(marker.time)).join("、")}</span>`;
      }

      function taskKey(task) {
        return `${task.task}|${task.assignee}|${task.source}`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function activateTab(tabName) {
        activeTab = tabName;
        document.querySelectorAll(".tab").forEach((item) => {
          item.classList.toggle("active", item.dataset.tab === tabName);
        });
        render();
      }

      function currentUser() {
        return document.querySelector("#user").value.trim();
      }

      function selectedFolder() {
        return folders.find((folder) => folder.id === selectedFolderId) || null;
      }

      function splitTags(value) {
        return String(value || "").split(/[、，,\n]/).map((item) => item.trim()).filter(Boolean);
      }

      function renderFolderSelect() {
        const folder = selectedFolder();
        folderSelect.disabled = folders.length === 0;
        newFolderBtn.disabled = !currentUser();
        folderSelect.innerHTML = folders.map((item) =>
          `<option value="${item.id}" ${item.id === selectedFolderId ? "selected" : ""}>${escapeHtml(item.name)}${item.is_default ? "（默认）" : ""}</option>`,
        ).join("");
        if (!folder) {
          folderHint.textContent = "未选择时会自动保存到默认文件夹。";
          return;
        }
        const description = [
          folder.is_default ? "默认归档" : "场景归档",
          folder.aliases?.length ? `称呼：${folder.aliases.join("、")}` : "未设置场景称呼",
          folder.keywords?.length ? `关键词：${folder.keywords.join("、")}` : "未设置关键词",
        ];
        folderHint.textContent = description.join(" · ");
      }

      async function loadFolders(preferredFolderId = "") {
        const user = currentUser();
        if (!user) {
          folders = [];
          selectedFolderId = "";
          renderFolderSelect();
          return;
        }
        const response = await fetch(`/api/meetings/folders?current_user=${encodeURIComponent(user)}`);
        if (!response.ok) throw new Error("文件夹加载失败");
        folders = await response.json();
        const available = new Set(folders.map((folder) => folder.id));
        selectedFolderId = available.has(preferredFolderId) ? preferredFolderId : (available.has(selectedFolderId) ? selectedFolderId : (folders[0]?.id || ""));
        renderFolderSelect();
      }

      async function createFolder({ name, keywords = [], aliases = [] }) {
        const response = await fetch("/api/meetings/folders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ current_user: currentUser(), name, keywords, aliases }),
        });
        if (!response.ok) throw new Error("文件夹创建失败");
        const folder = await response.json();
        await loadFolders(folder.id);
        return folder;
      }

      async function ensureSampleFolder(sample) {
        if (!sample.folder) return;
        await loadFolders();
        let folder = folders.find((item) => item.name === sample.folder.name);
        if (!folder) {
          folder = await createFolder(sample.folder);
        }
        selectedFolderId = folder.id;
        renderFolderSelect();
      }

      function meetingPayload() {
        return {
          current_user: currentUser(),
          transcript: document.querySelector("#transcript").value.trim(),
          audio_name: document.querySelector("#audio").files[0]?.name || "",
          folder_id: selectedFolderId,
          analysis: result,
        };
      }

      async function saveMeeting(silent = false) {
        if (!result || !currentUser() || !document.querySelector("#transcript").value.trim()) {
          if (!silent) generationStatus.textContent = "请先填写当前用户并生成一份包含转写的任务清单。";
          return;
        }

        if (!silent) {
          saveBtn.disabled = true;
          saveBtn.textContent = "保存中...";
        }
        try {
          const response = await fetch(
            currentMeetingId ? `/api/meetings/history/${currentMeetingId}` : "/api/meetings/history",
            {
              method: currentMeetingId ? "PUT" : "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(meetingPayload()),
            },
          );
          if (!response.ok) throw new Error("保存失败");
          const record = await response.json();
          currentMeetingId = record.id;
          saveBtn.disabled = false;
          saveBtn.textContent = "已保存到录音库";
          if (!silent) generationStatus.textContent = "已保存到本机录音库；后续人工判断会用于个性化分析。";
        } catch (error) {
          if (!silent) generationStatus.textContent = "保存失败，请稍后重试。";
          saveBtn.disabled = false;
          saveBtn.textContent = "保存到录音库";
        }
      }

      function updateSavedMeeting() {
        if (currentMeetingId) void saveMeeting(true);
      }

      async function loadLibrary() {
        const user = currentUser();
        if (!user) {
          libraryRecords = [];
          libraryMessage = "先填写当前用户，才能查看这台电脑上的个人录音库。";
          render();
          return;
        }
        libraryMessage = "正在读取本机记录...";
        render();
        try {
          await loadFolders();
          const response = await fetch(`/api/meetings/history?current_user=${encodeURIComponent(user)}&folder_id=${encodeURIComponent(selectedFolderId)}`);
          if (!response.ok) throw new Error("读取失败");
          libraryRecords = await response.json();
          libraryMessage = "";
        } catch (error) {
          libraryMessage = "暂时无法读取本机记录。";
        }
        render();
      }

      async function loadProfile() {
        const user = currentUser();
        if (!user) {
          profile = null;
          render();
          return;
        }
        profile = null;
        render();
        try {
          const response = await fetch(`/api/meetings/profile?current_user=${encodeURIComponent(user)}&folder_id=${encodeURIComponent(selectedFolderId)}`);
          if (!response.ok) throw new Error("读取失败");
          profile = await response.json();
        } catch (error) {
          profile = { error: true };
        }
        render();
      }

      function renderLibrary() {
        if (libraryMessage) return `<div class="empty">${escapeHtml(libraryMessage)}</div>`;
        if (!libraryRecords.length) {
          return '<div class="empty">还没有保存的记录。生成任务清单后，点击“保存到录音库”。</div>';
        }
        const query = compactText(libraryQuery);
        const records = libraryRecords.filter((record) => {
          const searchable = compactText(`${record.meeting_title} ${record.audio_name}`);
          return !query || searchable.includes(query);
        });
        if (!records.length) {
          return '<div class="empty">没有匹配的会议。试试输入更短的标题关键词。</div>';
        }
        return `
          <div class="library-list">
            ${records.map((record) => `
              <article class="library-item">
                <div class="library-item-main">
                  <span class="library-type">${record.audio_name ? "音" : "文"}</span>
                  <div class="library-item-copy">
                    <h3>${escapeHtml(record.meeting_title)}</h3>
                    <p class="panel-note">${escapeHtml(new Date(record.updated_at).toLocaleString("zh-CN"))}${record.audio_name ? ` · ${escapeHtml(record.audio_name)}` : " · 文字转写"}</p>
                    <div class="library-stats">
                      <span class="library-stat">${record.task_count} 项任务</span>
                      <span class="library-stat">${record.my_task_count} 项与我有关</span>
                      ${record.confirmed_task_count ? `<span class="library-stat">${record.confirmed_task_count} 项已确认</span>` : ""}
                    </div>
                  </div>
                </div>
                <button class="btn" type="button" data-library-action="open" data-meeting-id="${escapeHtml(record.id)}">打开</button>
              </article>
            `).join("")}
          </div>
        `;
      }

      function renderFolderGrid() {
        if (!folders.length) return "";
        return `<div class="folder-grid">${folders.map((folder) => `
          <button class="folder-card ${folder.id === selectedFolderId ? "active" : ""}" type="button" data-library-action="folder" data-folder-id="${folder.id}">
            <div class="folder-card-top"><strong>${escapeHtml(folder.name)}</strong><span>${folder.meeting_count || 0} 条</span></div>
            <small>${folder.aliases?.length ? `称呼：${escapeHtml(folder.aliases.join("、"))}` : "使用账号默认称呼"}</small>
            <small>${folder.keywords?.length ? escapeHtml(folder.keywords.join("、")) : "未分类记录"}</small>
          </button>
        `).join("")}</div>`;
      }

      function profileItems(items, emptyText) {
        if (!items?.length) return `<p class="panel-note">${emptyText}</p>`;
        return `<div class="profile-list">${items.map((item) => `<div class="plain-card">${escapeHtml(item)}</div>`).join("")}</div>`;
      }

      function renderProfile() {
        if (!currentUser()) return '<div class="empty">先填写当前用户，再查看个人工作画像。</div>';
        if (!profile) return '<div class="empty">正在整理你在本机留下的人工反馈...</div>';
        if (profile.error) return '<div class="empty">暂时无法读取个人画像。</div>';
        return `
          <div class="hero-metric">
            <div class="metric"><strong>${profile.saved_meeting_count}</strong><span>已保存会议</span></div>
            <div class="metric"><strong>${profile.confirmed_tasks.length}</strong><span>确认过的任务类型</span></div>
            <div class="metric"><strong>${profile.excluded_tasks.length}</strong><span>排除过的任务类型</span></div>
          </div>
          <h2 class="panel-title">${escapeHtml(currentUser())}的个人工作画像</h2>
          <p class="task-triage-note">只使用你在本机主动确认、排除或修改过的任务，帮助模型判断后续会议里的模糊候选项；会议原文中的明确负责人永远优先。</p>
          <h3>通常归入我的任务</h3>
          ${profileItems(profile.confirmed_tasks, "还没有足够的人工确认记录。")}
          <h3 style="margin-top: 22px">通常不是我的任务</h3>
          ${profileItems(profile.excluded_tasks, "还没有排除记录。")}
          <h3 style="margin-top: 22px">近期协作者</h3>
          ${profileItems(profile.collaborators, "保存并确认共同任务后会显示在这里。")}
        `;
      }

      function compactText(value) {
        return String(value || "").replace(/[\s，。、“”"'：:；;,.!?！？]/g, "");
      }

      function highlightText(text, query) {
        let highlighted = escapeHtml(text);
        const fragments = String(query || "")
          .split(/[，。；、\s!?！？]+/)
          .filter((fragment) => fragment.length >= 3)
          .sort((left, right) => right.length - left.length);
        fragments.forEach((fragment) => {
          const safeFragment = escapeHtml(fragment);
          highlighted = highlighted.replaceAll(safeFragment, `<mark>${safeFragment}</mark>`);
        });
        return highlighted;
      }

      function findTranscriptTrace(query) {
        const lines = document.querySelector("#transcript").value.split(/\r?\n/);
        const queryKey = compactText(query);
        if (queryKey.length < 3) return null;

        let source = "会议转写";
        let bestMatch = null;
        lines.forEach((rawLine) => {
          const line = rawLine.trim();
          if (!line) return;
          const timestamp = line.match(/^(\d{1,2}:\d{2}(?::\d{2})?)/);
          if (timestamp) source = timestamp[1];
          const lineKey = compactText(line);
          if (lineKey.length < 3) return;
          const overlap = [...new Set(queryKey)].filter((character) => lineKey.includes(character)).length;
          const score = (lineKey.includes(queryKey) || queryKey.includes(lineKey) ? 100 : 0) + overlap / queryKey.length;
          if (!bestMatch || score > bestMatch.score) bestMatch = { source, evidence: line, score };
        });
        return bestMatch && bestMatch.score > 0.18 ? bestMatch : null;
      }

      function renderFocusWorkspace() {
        const sourceCards = (focusResult?.sources || [])
          .map((source, index) => `
            <article class="focus-source">
              <div class="focus-source-top">
                <span class="focus-source-time">原文依据｜${escapeHtml(source.source)}</span>
                <button class="btn" type="button" data-focus-action="trace-source" data-source-index="${index}">查看原文</button>
              </div>
              <p class="quote" style="margin-top: 10px">${escapeHtml(source.evidence)}</p>
              ${source.reason ? `<p class="focus-reason">${escapeHtml(source.reason)}</p>` : ""}
            </article>
          `)
          .join("");

        const output = focusLoading
          ? `<div class="focus-loading">正在定位与你有关的重点和原文依据...</div>`
          : focusResult
            ? `
              <section class="focus-answer">
                <div class="focus-source-top">
                  <span class="focus-kicker">个人重点输出</span>
                  <button class="btn" type="button" data-focus-action="copy-answer">复制重点</button>
                </div>
                <h3>${escapeHtml(focusResult.title)}</h3>
                <p>${escapeHtml(focusResult.answer)}</p>
              </section>
              <section class="focus-source-list">
                <div class="focus-source-title">原文依据</div>
                ${sourceCards || '<div class="empty">暂未定位到可复查的原文依据。</div>'}
              </section>
              <section class="focus-query">
                <label for="traceQuery">复查索引</label>
                <div class="focus-search">
                  <input class="input" id="traceQuery" placeholder="输入一句话或粘贴一段原文，定位对应内容" />
                  <button class="btn" type="button" data-focus-action="search-trace">检索原文</button>
                </div>
              </section>
              ${focusTrace ? `
                <section class="focus-trace">
                  <div class="focus-trace-top">
                    <span class="focus-source-time">原文溯源｜${escapeHtml(focusTrace.source)}</span>
                    <button class="btn" type="button" data-focus-action="copy-trace">复制原文</button>
                  </div>
                  <p>${highlightText(focusTrace.evidence, focusTrace.query || focusQuery)}</p>
                </section>
              ` : ""}
            `
            : '<div class="empty">输入一个你最关心的问题。生成后，答案会附带可复查的原文依据。</div>';

        return `
          <div class="focus-workspace">
            <div class="focus-heading">
              <div>
                <p class="focus-kicker">个人重点</p>
                <h2>这场沟通里，你最想弄清什么？</h2>
              </div>
            </div>
            <section class="focus-query">
              <label for="focusQuery">输入重点</label>
              <textarea id="focusQuery" placeholder="例如：我接下来要准备什么？客户对方案最在意的是什么？">${escapeHtml(focusQuery)}</textarea>
              <div class="button-row">
                <button class="btn btn-primary" type="button" data-focus-action="generate" ${focusLoading ? "disabled" : ""}>生成个人重点</button>
                ${focusLoading ? '<button class="btn" type="button" data-focus-action="cancel">暂停生成</button>' : ""}
              </div>
              ${focusMessage ? `<p class="panel-note">${escapeHtml(focusMessage)}</p>` : ""}
            </section>
            ${output}
          </div>
        `;
      }

      function updateTaskStatus(key, status) {
        if (!result) return;

        ["my_tasks", "all_tasks"].forEach((field) => {
          (result[field] || []).forEach((task) => {
            if (taskKey(task) === key) {
              task.status = status;
            }
          });
        });

        render();
        updateSavedMeeting();
      }

      function taskBelongsToMe(task) {
        if (task.personal === true) return true;
        if (task.personal === false) return false;
        const identities = new Set([resultUser, ...(selectedFolder()?.aliases || [])].filter(Boolean));
        return task.assignee.split(/[、，,和与及\s]+/).some((name) => identities.has(name));
      }

      function setTaskPersonal(key, isMine) {
        if (!result) return;
        (result.all_tasks || []).forEach((task) => {
          if (taskKey(task) === key) {
            task.personal = isMine;
            task.status = isMine ? "已确认" : "已取消";
          }
        });
        result.my_tasks = (result.all_tasks || []).filter(taskBelongsToMe);
        render();
        updateSavedMeeting();
      }

      function taskStatusStyle(status) {
        if (status === "已确认") return "confirmed";
        if (status === "已取消") return "cancelled";
        if (status === "已忽略") return "muted";
        return "pending";
      }

      function renderTranscriptLine(line) {
        const source = String(line || "").match(/^(\d{1,2}:\d{2}(?::\d{2})?)/)?.[1] || "";
        const marker = (result?.marked_moments || []).find((item) => item.time === source);
        return `<div class="transcript-line ${marker ? "transcript-line--marked" : ""}">
          ${marker ? `<span class="transcript-marker-label">录音豆重点${marker.note ? ` · ${escapeHtml(marker.note)}` : ""}</span><br>` : ""}
          ${escapeHtml(line)}
        </div>`;
      }

      function updateTaskFields(key, fields) {
        if (!result) return;

        ["my_tasks", "all_tasks"].forEach((field) => {
          (result[field] || []).forEach((task) => {
            if (taskKey(task) === key) {
              Object.assign(task, fields);
            }
          });
        });

        editingTaskKey = "";
        render();
        updateSavedMeeting();
      }

      function render() {
        if (activeTab === "library") {
          const myTaskCount = libraryRecords.reduce((total, record) => total + (record.my_task_count || 0), 0);
          const confirmedCount = libraryRecords.reduce((total, record) => total + (record.confirmed_task_count || 0), 0);
          content.innerHTML = `
            <div class="hero-metric">
              <div class="metric"><strong>${libraryRecords.length}</strong><span>已保存会议</span></div>
              <div class="metric"><strong>${myTaskCount}</strong><span>与我有关的任务</span></div>
              <div class="metric"><strong>${confirmedCount}</strong><span>已确认任务</span></div>
            </div>
            <h2 class="panel-title">录音库</h2>
            <p class="panel-note">按场景查看并沉淀个人偏好。点击文件夹可直接进入该场景；未指定归档的记录会进入默认文件夹。</p>
            ${renderFolderGrid()}
            <h3>${escapeHtml(selectedFolder()?.name || "默认文件夹")}</h3>
            <div class="library-toolbar">
              <input class="input" id="libraryQuery" value="${escapeHtml(libraryQuery)}" placeholder="搜索会议标题或录音文件名" />
              <button class="btn" type="button" data-library-action="search">搜索</button>
            </div>
            ${renderLibrary()}
          `;
          return;
        }
        if (activeTab === "profile") {
          content.innerHTML = renderProfile();
          return;
        }
        if (activeTab === "focus") {
          content.innerHTML = renderFocusWorkspace();
          return;
        }
        if (!result) {
          content.innerHTML = '<div class="empty">上传录音或直接点击生成，查看 Demo 结果。</div>';
          return;
        }
        if (Array.isArray(result.all_tasks)) {
          result.my_tasks = result.all_tasks.filter(taskBelongsToMe);
        }

        function taskCards(tasks, mode = "default") {
          if (!tasks || tasks.length === 0) {
            return '<div class="empty">没有识别到明确待办。</div>';
          }

          return tasks
            .map(
              (task) => {
                const key = taskKey(task);
                const isEditing = editingTaskKey === key;
                const isTriage = mode === "triage";
                const statusStyle = taskStatusStyle(task.status);
                const decisionNote = task.personal === true
                  ? "已确认并归入我的待办"
                  : task.personal === false
                    ? "已取消，已排除为非我的任务"
                    : "系统根据负责人做了初步判断，请你确认";

                return `
                <article class="task-card ${statusStyle === "confirmed" ? "task-card--confirmed" : statusStyle === "cancelled" ? "task-card--cancelled" : ""}">
                  <div class="task-top">
                    <h3 class="task-title">${task.task}</h3>
                    <span class="badge badge--${statusStyle}">${task.status}</span>
                  </div>
                  <div class="meta">
                    <span><b>负责人</b>${task.assignee}</span>
                    <span><b>截止</b>${task.deadline}</span>
                    <span><b>置信度</b>${Math.round(task.confidence * 100)}%</span>
                  </div>
                  <p class="quote"><strong>来源片段｜${task.source}</strong><br>${task.evidence}</p>
                  ${
                    isEditing
                      ? `
                        <div class="field" style="margin-top: 12px">
                          <label>负责人</label>
                          <input class="input" data-edit-field="assignee" data-task-key="${key}" value="${task.assignee}" />
                        </div>
                        <div class="field" style="margin-top: 12px">
                          <label>截止时间</label>
                          <input class="input" data-edit-field="deadline" data-task-key="${key}" value="${task.deadline}" />
                        </div>
                      `
                      : ""
                  }
                  ${
                    isTriage
                      ? `<div class="task-decision">
                           <p class="task-decision-note">${decisionNote}</p>
                           <div class="button-row">
                             <button class="btn btn-claim" type="button" data-task-action="claim" data-task-key="${key}">${task.personal === true ? "仍是我的" : "是我的"}</button>
                             <button class="btn" type="button" data-task-action="reject" data-task-key="${key}">${task.personal === false ? "仍不是我的" : "不是我的"}</button>
                           </div>
                         </div>`
                      : `<div class="button-row" style="margin-top: 12px">
                           ${
                             isEditing
                               ? `<button class="btn" type="button" data-task-action="save" data-task-key="${key}">保存</button>
                                  <button class="btn" type="button" data-task-action="cancel-edit" data-task-key="${key}">取消</button>`
                               : `<button class="btn" type="button" data-task-action="confirm" data-task-key="${key}">确认任务</button>
                                  <button class="btn" type="button" data-task-action="edit" data-task-key="${key}">修改</button>
                                  <button class="btn" type="button" data-task-action="ignore" data-task-key="${key}">忽略</button>`
                           }
                         </div>`
                  }
                </article>
              `;
              },
            )
            .join("");
        }

        function insightCards(items) {
          if (!items || items.length === 0) {
            return "";
          }

          return items
            .map(
              (item) => `
                <div class="plain-card">
                  <strong>${item.title}</strong>
                  <p class="panel-note" style="margin-top: 6px">来源片段｜${item.source}</p>
                  <p style="margin: 8px 0 0">${item.evidence}</p>
                </div>
              `,
            )
            .join("");
        }

        if (activeTab === "task-list") {
          const allTasks = result.all_tasks || result.my_tasks;
          const reviewCount = allTasks.filter((task) => task.personal === undefined).length;
          const memoryNotes = result.personalization_notes || [];
          content.innerHTML = `
            <div class="hero-metric">
              <div class="metric"><strong>${result.my_tasks.length}</strong><span>已归入我的待办</span></div>
              <div class="metric"><strong>${allTasks.length}</strong><span>候选任务</span></div>
              <div class="metric"><strong>${reviewCount}</strong><span>待你确认</span></div>
            </div>
            <h2 class="panel-title">任务清单</h2>
            <p class="task-triage-note">先快速判断每条候选任务是不是你的。你的选择会覆盖系统对负责人的初始判断，并即时同步到“我的待办”。</p>
            ${memoryNotes.length ? `<p class="task-triage-note"><strong>个性化分析已启用</strong><br>${memoryNotes.map(escapeHtml).join("<br>")}</p>` : ""}
            <div class="task-list">
              ${taskCards(allTasks, "triage")}
            </div>
          `;
          return;
        }

        if (activeTab === "actions" || activeTab === "all-actions") {
          const tasks = activeTab === "actions" ? result.my_tasks : (result.all_tasks || result.my_tasks);
          const title = activeTab === "actions" ? "我的待办" : "全部待办";
          content.innerHTML = `
            <div class="hero-metric">
              <div class="metric"><strong>${result.my_tasks.length}</strong><span>我的待办</span></div>
              <div class="metric"><strong>${(result.all_tasks || result.my_tasks).length}</strong><span>全部待办</span></div>
              <div class="metric"><strong>${result.risks.length}</strong><span>风险提醒</span></div>
            </div>
            <h2 class="panel-title">${result.meeting_title}</h2>
            <p class="panel-note">${result.demo_mode ? "当前显示本地规则解析结果，请核对任务。" : "已使用 AI 分析会议内容。"}</p>
            <h3>${title}</h3>
            <div class="task-list">
              ${taskCards(tasks)}
            </div>
          `;
          return;
        }

        if (activeTab === "summary") {
          content.innerHTML = `
            <h2 class="panel-title">${result.meeting_title}</h2>
            <p class="panel-note">${result.demo_mode ? "当前显示本地规则解析结果，请核对任务。" : "已使用 AI 分析会议内容。"}</p>
            <p class="plain-card">${result.summary}</p>
            <h3>关键决策</h3>
            <div class="list">${result.decisions.map((item) => `<div class="plain-card">${item}</div>`).join("")}</div>
            ${(result.questions || []).length ? `<h3>待确认问题</h3><div class="list">${insightCards(result.questions)}</div>` : ""}
            ${(result.evidence_notes || []).length ? `<h3>背景证据</h3><div class="list">${insightCards(result.evidence_notes)}</div>` : ""}
            <h3>风险提醒</h3>
            <div class="list">${result.risks.map((item) => `<div class="plain-card">${item}</div>`).join("")}</div>
          `;
          return;
        }

        content.innerHTML = `
          <h2 class="panel-title">全文转写</h2>
          <p class="panel-note">带“录音豆重点”的片段来自设备按压事件，可回看用户当时主动关注的内容。</p>
          ${(result.transcript || []).map(renderTranscriptLine).join("")}
        `;
      }

      function renderSampleOptions() {
        sampleOptionList.innerHTML = testSamples.map((sample) => `
          <button class="sample-option" type="button" data-sample-file="${sample.file}">
            <strong>${sample.title}</strong>
            <span>${sample.detail}</span>
          </button>
        `).join("");
      }

      async function loadSample(sample) {
        sampleBtn.disabled = true;
        sampleBtn.textContent = "加载中...";

        try {
          const response = await fetch(`/static/samples/${sample.file}?v=identity-folders`);
          if (!response.ok) throw new Error("测试转写加载失败");
          document.querySelector("#transcript").value = await response.text();
          document.querySelector("#user").value = sample.user;
          markers.splice(0, markers.length, ...(sample.markers || []).map((marker) => ({
            label: "录音豆重点",
            time: marker.time,
            note: marker.note,
            source: "recording_bean",
          })));
          renderMarkers();
          await ensureSampleFolder(sample);
          document.querySelector("#user").focus();
          generationStatus.textContent = `已加载「${sample.title}」并选中「${selectedFolder()?.name || "默认文件夹"}」，可直接生成任务清单。`;
        } catch {
          generationStatus.textContent = "测试转写加载失败，请稍后重试。";
        } finally {
          sampleBtn.disabled = false;
          sampleBtn.textContent = "加载测试转写";
        }
      }

      sampleBtn.addEventListener("click", () => {
        renderSampleOptions();
        sampleDialog.showModal();
      });

      sampleDialog.addEventListener("click", (event) => {
        if (event.target === sampleDialog || event.target.closest("[data-sample-action='close']")) {
          sampleDialog.close();
          return;
        }
        const option = event.target.closest("[data-sample-file]");
        if (!option) return;
        const sample = testSamples.find((item) => item.file === option.dataset.sampleFile);
        if (!sample) return;
        sampleDialog.close();
        void loadSample(sample);
      });

      analyzeBtn.addEventListener("click", async () => {
        analysisController = new AbortController();
        analyzeBtn.disabled = true;
        analyzeBtn.textContent = "分析中...";
        pauseBtn.disabled = false;
        generationStatus.textContent = "正在生成，可暂停后修改输入。";

        const analysisUser = document.querySelector("#user").value.trim();
        if (analysisUser && !selectedFolderId) {
          try {
            await loadFolders();
          } catch {
            generationStatus.textContent = "文件夹加载失败，仍会按默认场景继续分析。";
          }
        }

        const formData = new FormData();
        const audio = document.querySelector("#audio").files[0];
        if (audio) formData.append("audio", audio);
        formData.append("transcript", document.querySelector("#transcript").value);
        formData.append("current_user", analysisUser);
        formData.append("markers", JSON.stringify(markers));
        formData.append("folder_id", selectedFolderId);

        try {
          const response = await fetch("/api/meetings/analyze", {
            method: "POST",
            body: formData,
            signal: analysisController.signal,
          });
          if (!response.ok) throw new Error("会议分析失败");
          result = await response.json();
          resultUser = analysisUser;
          currentMeetingId = "";
          saveBtn.disabled = false;
          saveBtn.textContent = "保存到录音库";
          activateTab("task-list");
          render();
          generationStatus.textContent = "";
        } catch (error) {
          if (error.name === "AbortError") {
            generationStatus.textContent = "已暂停生成。修改输入后可重新生成。";
          } else {
            generationStatus.textContent = "生成失败，请检查输入或网络后重试。";
          }
        } finally {
          analyzeBtn.disabled = false;
          analyzeBtn.textContent = "生成任务清单";
          pauseBtn.disabled = true;
          analysisController = null;
        }
      });

      pauseBtn.addEventListener("click", () => {
        analysisController?.abort();
      });

      saveBtn.addEventListener("click", () => {
        void saveMeeting();
      });

      folderSelect.addEventListener("change", () => {
        selectedFolderId = folderSelect.value;
        renderFolderSelect();
        if (activeTab === "library") void loadLibrary();
      });

      document.querySelector("#user").addEventListener("change", () => {
        selectedFolderId = "";
        void loadFolders();
      });

      newFolderBtn.addEventListener("click", () => {
        if (!currentUser()) return;
        folderForm.reset();
        folderDialog.showModal();
      });

      folderDialog.addEventListener("click", (event) => {
        if (event.target === folderDialog || event.target.closest("[data-folder-action='close']")) {
          folderDialog.close();
        }
      });

      folderForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = document.querySelector("#folderName").value.trim();
        if (!name) return;
        createFolder({
          name,
          keywords: splitTags(document.querySelector("#folderKeywords").value),
          aliases: splitTags(document.querySelector("#folderAliases").value),
        }).then(() => {
          folderDialog.close();
          generationStatus.textContent = `已创建「${name}」，之后保存的记录会归入该场景。`;
        }).catch(() => {
          generationStatus.textContent = "文件夹创建失败，请稍后重试。";
        });
      });

      focusBtn.addEventListener("click", () => {
        activateTab("focus");
        content.querySelector("#focusQuery")?.focus();
      });

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          activateTab(tab.dataset.tab);
          if (tab.dataset.tab === "library") void loadLibrary();
          if (tab.dataset.tab === "profile") void loadProfile();
        });
      });

      content.addEventListener("click", (event) => {
        const libraryButton = event.target.closest("[data-library-action]");
        if (libraryButton?.dataset.libraryAction === "folder") {
          selectedFolderId = libraryButton.dataset.folderId;
          renderFolderSelect();
          void loadLibrary();
          return;
        }
        if (libraryButton?.dataset.libraryAction === "search") {
          libraryQuery = content.querySelector("#libraryQuery")?.value.trim() || "";
          render();
          return;
        }
        if (libraryButton?.dataset.libraryAction === "open") {
          const user = currentUser();
          const meetingId = libraryButton.dataset.meetingId;
          fetch(`/api/meetings/history/${meetingId}?current_user=${encodeURIComponent(user)}`)
            .then(async (response) => {
              if (!response.ok) throw new Error("读取失败");
              return response.json();
            })
            .then((record) => {
              result = record.analysis;
              resultUser = record.current_user;
              currentMeetingId = record.id;
              selectedFolderId = record.folder_id || selectedFolderId;
              document.querySelector("#user").value = record.current_user;
              void loadFolders(selectedFolderId);
              document.querySelector("#transcript").value = record.transcript;
              saveBtn.disabled = false;
              saveBtn.textContent = "已保存到录音库";
              activateTab("task-list");
            })
            .catch(() => {
              libraryMessage = "打开记录失败，请稍后重试。";
              render();
            });
          return;
        }

        const focusActionButton = event.target.closest("[data-focus-action]");
        if (focusActionButton) {
          const focusAction = focusActionButton.dataset.focusAction;
          focusQuery = content.querySelector("#focusQuery")?.value.trim() || focusQuery;

          if (focusAction === "cancel") {
            focusController?.abort();
            return;
          }

          if (focusAction === "copy-answer" && focusResult) {
            navigator.clipboard.writeText(focusResult.answer).then(() => {
              focusMessage = "个人重点已复制。";
              render();
            });
            return;
          }

          if (focusAction === "copy-trace" && focusTrace) {
            navigator.clipboard.writeText(focusTrace.evidence).then(() => {
              focusMessage = "原文已复制。";
              render();
            });
            return;
          }

          if (focusAction === "trace-source" && focusResult) {
            const source = focusResult.sources[Number(focusActionButton.dataset.sourceIndex)];
            if (source) {
              focusTrace = { ...source, query: source.evidence };
              focusMessage = "已定位到这条原文。";
              render();
            }
            return;
          }

          if (focusAction === "search-trace") {
            const traceQuery = content.querySelector("#traceQuery")?.value.trim() || "";
            const match = findTranscriptTrace(traceQuery);
            if (match) {
              focusTrace = { ...match, query: traceQuery };
              focusMessage = "已找到最相关的原文片段。";
            } else {
              focusMessage = "没有找到足够相关的原文，请换一个更短的关键词或句子。";
            }
            render();
            return;
          }

          if (focusAction === "generate") {
            const transcript = document.querySelector("#transcript").value.trim();
            if (!transcript) {
              focusMessage = "请先粘贴会议转写、上传录音，或加载测试转写。";
              render();
              return;
            }
            if (!focusQuery) {
              focusMessage = "请输入你最关心的问题。";
              render();
              return;
            }

            focusLoading = true;
            focusMessage = "";
            focusResult = null;
            focusTrace = null;
            focusController = new AbortController();
            render();

            const formData = new FormData();
            formData.append("transcript", transcript);
            formData.append("current_user", document.querySelector("#user").value.trim());
            formData.append("focus_query", focusQuery);
            formData.append("folder_id", selectedFolderId);

            fetch("/api/meetings/focus", {
              method: "POST",
              body: formData,
              signal: focusController.signal,
            })
              .then(async (response) => {
                if (!response.ok) throw new Error("个人重点生成失败");
                return response.json();
              })
              .then((data) => {
                focusResult = data;
                focusTrace = data.sources?.[0] || null;
              })
              .catch((error) => {
                focusMessage = error.name === "AbortError"
                  ? "已暂停生成。修改重点后可重新生成。"
                  : "生成失败，请检查网络或稍后重试。";
              })
              .finally(() => {
                focusLoading = false;
                focusController = null;
                render();
              });
            return;
          }
        }

        const button = event.target.closest("[data-task-action]");
        if (!button) return;

        const action = button.dataset.taskAction;
        const key = button.dataset.taskKey;

        if (action === "claim" || action === "reject") {
          setTaskPersonal(key, action === "claim");
          return;
        }

        if (action === "confirm" || action === "ignore") {
          updateTaskStatus(key, action === "confirm" ? "已确认" : "已忽略");
          return;
        }

        if (action === "edit") {
          editingTaskKey = key;
          render();
          return;
        }

        if (action === "cancel-edit") {
          editingTaskKey = "";
          render();
          return;
        }

        if (action === "save") {
          const assignee = content.querySelector(`[data-edit-field="assignee"][data-task-key="${key}"]`)?.value || "待确认";
          const deadline = content.querySelector(`[data-edit-field="deadline"][data-task-key="${key}"]`)?.value || "待确认";
          updateTaskFields(key, { assignee, deadline, status: "已修改" });
        }
      });
    </script>
  </body>
</html>
