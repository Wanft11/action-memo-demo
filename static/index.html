<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action Memo Demo</title>
    <style>
      :root {
        --bg: #f7f8fb;
        --panel: #ffffff;
        --ink: #172033;
        --muted: #667085;
        --line: #d9dee8;
        --blue: #2157ff;
        --green: #14845d;
        --amber: #b65c00;
        --shadow: 0 18px 50px rgba(23, 32, 51, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .device-dot {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 28%, #eef3ff, #1c2537 72%);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.45);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 4px 0 0;
        color: var(--muted);
      }

      .status-pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        padding: 8px 12px;
        color: var(--green);
        white-space: nowrap;
      }

      .grid {
        display: grid;
        grid-template-columns: 410px 1fr;
        gap: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .panel-header {
        padding: 18px 18px 0;
      }

      .panel-title {
        margin: 0 0 4px;
        font-size: 18px;
      }

      .panel-note {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .controls {
        padding: 18px;
        display: grid;
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        color: #39445a;
        font-weight: 650;
      }

      .input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        padding: 11px 12px;
      }

      textarea {
        min-height: 185px;
        resize: vertical;
        line-height: 1.55;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .btn {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        min-height: 42px;
        padding: 0 14px;
        font-weight: 700;
      }

      .btn-primary {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }

      .btn:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .markers {
        display: grid;
        gap: 8px;
      }

      .marker {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid #d8e2ff;
        background: #f5f7ff;
        border-radius: 8px;
        padding: 10px 12px;
      }

      .tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        padding: 14px 16px 0;
      }

      .tab {
        border: 0;
        border-bottom: 3px solid transparent;
        border-radius: 0;
        background: transparent;
        padding: 10px 8px;
        color: var(--muted);
        cursor: pointer;
        font-weight: 700;
      }

      .tab.active {
        color: var(--blue);
        border-bottom-color: var(--blue);
      }

      .content {
        padding: 18px;
      }

      .hero-metric {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fbfcff;
      }

      .metric strong {
        display: block;
        font-size: 24px;
      }

      .metric span {
        color: var(--muted);
      }

      .task-list,
      .list {
        display: grid;
        gap: 12px;
        margin-top: 14px;
      }

      .task-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        background: #fff;
      }

      .task-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .task-title {
        margin: 0;
        font-size: 17px;
      }

      .badge {
        border-radius: 999px;
        background: #fff7ed;
        color: var(--amber);
        padding: 5px 9px;
        font-size: 13px;
        white-space: nowrap;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
        color: var(--muted);
      }

      .quote {
        margin: 0;
        border-left: 3px solid var(--blue);
        background: #f5f7ff;
        padding: 10px 12px;
        color: #39445a;
        line-height: 1.55;
      }

      .plain-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 13px 14px;
        background: #fff;
        line-height: 1.6;
      }

      .transcript-line {
        border-bottom: 1px solid #edf0f5;
        padding: 10px 0;
        line-height: 1.6;
      }

      .empty {
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 28px;
        text-align: center;
        background: #fbfcff;
      }

      @media (max-width: 900px) {
        .shell {
          padding: 18px;
        }

        .grid,
        .hero-metric {
          grid-template-columns: 1fr;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="device-dot" aria-hidden="true"></div>
          <div>
            <h1>Action Memo</h1>
            <p class="subtitle">把 soundcore Work 3200 的录音变成个人行动清单</p>
          </div>
        </div>
        <div class="status-pill">设备状态：录音豆在线</div>
      </header>

      <main class="grid">
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">会议输入</h2>
            <p class="panel-note">配置 API Key 后可识别真实录音；未配置时自动使用黑客松模拟结果。</p>
          </div>
          <div class="controls">
            <div class="field">
              <label for="user">当前用户</label>
              <input class="input" id="user" value="王同学" />
            </div>

            <div class="field">
              <label for="audio">录音文件</label>
              <input class="input" id="audio" type="file" accept="audio/*,video/mp4,.mp3,.mp4,.mpeg,.mpga,.m4a,.wav,.webm" />
            </div>

            <div class="field">
              <label for="transcript">会议转写</label>
              <textarea id="transcript" placeholder="可选：粘贴会议文字后会直接生成纪要；上传录音时留空即可。"></textarea>
            </div>

            <div class="button-row">
              <button class="btn" id="markBtn" type="button">添加重点标记</button>
              <button class="btn btn-primary" id="analyzeBtn" type="button">生成我的纪要</button>
            </div>

            <div class="markers" id="markers"></div>
          </div>
        </section>

        <section class="panel">
          <div class="tabs">
            <button class="tab active" data-tab="actions" type="button">我的待办</button>
            <button class="tab" data-tab="all-actions" type="button">全部待办</button>
            <button class="tab" data-tab="summary" type="button">会议摘要</button>
            <button class="tab" data-tab="transcript" type="button">全文转写</button>
          </div>
          <div class="content" id="content">
            <div class="empty">上传录音或直接点击生成，查看 Demo 结果。</div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const markers = [];
      let result = null;
      let resultUser = "";
      let activeTab = "actions";
      let editingTaskKey = "";

      const content = document.querySelector("#content");
      const markersEl = document.querySelector("#markers");
      const analyzeBtn = document.querySelector("#analyzeBtn");
      const markBtn = document.querySelector("#markBtn");

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function nextTimestamp() {
        const seconds = 65 + markers.length * 30;
        return `${pad(Math.floor(seconds / 60))}:${pad(seconds % 60)}`;
      }

      function renderMarkers() {
        markersEl.innerHTML = markers
          .map(
            (marker) => `
              <div class="marker">
                <strong>${marker.time}</strong>
                <span>${marker.note}</span>
              </div>
            `,
          )
          .join("");
      }

      function taskKey(task) {
        return `${task.task}|${task.assignee}|${task.source}`;
      }

      function updateTaskStatus(key, status) {
        if (!result) return;

        ["my_tasks", "all_tasks"].forEach((field) => {
          (result[field] || []).forEach((task) => {
            if (taskKey(task) === key) {
              task.status = status;
            }
          });
        });

        render();
      }

      function updateTaskFields(key, fields) {
        if (!result) return;

        ["my_tasks", "all_tasks"].forEach((field) => {
          (result[field] || []).forEach((task) => {
            if (taskKey(task) === key) {
              Object.assign(task, fields);
            }
          });
        });

        editingTaskKey = "";
        render();
      }

      function render() {
        if (!result) {
          content.innerHTML = '<div class="empty">上传录音或直接点击生成，查看 Demo 结果。</div>';
          return;
        }
        if (Array.isArray(result.all_tasks)) {
          result.my_tasks = result.all_tasks.filter((task) =>
            task.assignee.split(/[、，,和与及\s]+/).includes(resultUser),
          );
        }

        function taskCards(tasks) {
          if (!tasks || tasks.length === 0) {
            return '<div class="empty">没有识别到明确待办。</div>';
          }

          return tasks
            .map(
              (task) => {
                const key = taskKey(task);
                const isEditing = editingTaskKey === key;

                return `
                <article class="task-card">
                  <div class="task-top">
                    <h3 class="task-title">${task.task}</h3>
                    <span class="badge">${task.status}</span>
                  </div>
                  <div class="meta">
                    <span>负责人：${task.assignee}</span>
                    <span>截止：${task.deadline}</span>
                    <span>置信度：${Math.round(task.confidence * 100)}%</span>
                  </div>
                  <p class="quote"><strong>来源片段｜${task.source}</strong><br>${task.evidence}</p>
                  ${
                    isEditing
                      ? `
                        <div class="field" style="margin-top: 12px">
                          <label>负责人</label>
                          <input class="input" data-edit-field="assignee" data-task-key="${key}" value="${task.assignee}" />
                        </div>
                        <div class="field" style="margin-top: 12px">
                          <label>截止时间</label>
                          <input class="input" data-edit-field="deadline" data-task-key="${key}" value="${task.deadline}" />
                        </div>
                      `
                      : ""
                  }
                  <div class="button-row" style="margin-top: 12px">
                    ${
                      isEditing
                        ? `<button class="btn" type="button" data-task-action="save" data-task-key="${key}">保存</button>
                           <button class="btn" type="button" data-task-action="cancel-edit" data-task-key="${key}">取消</button>`
                        : `<button class="btn" type="button" data-task-action="confirm" data-task-key="${key}">确认任务</button>
                           <button class="btn" type="button" data-task-action="edit" data-task-key="${key}">修改</button>
                           <button class="btn" type="button" data-task-action="ignore" data-task-key="${key}">忽略</button>`
                    }
                  </div>
                </article>
              `;
              },
            )
            .join("");
        }

        function insightCards(items) {
          if (!items || items.length === 0) {
            return "";
          }

          return items
            .map(
              (item) => `
                <div class="plain-card">
                  <strong>${item.title}</strong>
                  <p class="panel-note" style="margin-top: 6px">来源片段｜${item.source}</p>
                  <p style="margin: 8px 0 0">${item.evidence}</p>
                </div>
              `,
            )
            .join("");
        }

        if (activeTab === "actions" || activeTab === "all-actions") {
          const tasks = activeTab === "actions" ? result.my_tasks : (result.all_tasks || result.my_tasks);
          const title = activeTab === "actions" ? "我的待办" : "全部待办";
          content.innerHTML = `
            <div class="hero-metric">
              <div class="metric"><strong>${result.my_tasks.length}</strong><span>我的待办</span></div>
              <div class="metric"><strong>${(result.all_tasks || result.my_tasks).length}</strong><span>全部待办</span></div>
              <div class="metric"><strong>${result.risks.length}</strong><span>风险提醒</span></div>
            </div>
            <h2 class="panel-title">${result.meeting_title}</h2>
            <p class="panel-note">${result.demo_mode ? "当前显示本地规则解析结果，请核对任务。" : "已使用 AI 分析会议内容。"}</p>
            <h3>${title}</h3>
            <div class="task-list">
              ${taskCards(tasks)}
            </div>
          `;
          return;
        }

        if (activeTab === "summary") {
          content.innerHTML = `
            <h2 class="panel-title">${result.meeting_title}</h2>
            <p class="panel-note">${result.demo_mode ? "当前显示本地规则解析结果，请核对任务。" : "已使用 AI 分析会议内容。"}</p>
            <p class="plain-card">${result.summary}</p>
            <h3>关键决策</h3>
            <div class="list">${result.decisions.map((item) => `<div class="plain-card">${item}</div>`).join("")}</div>
            ${(result.questions || []).length ? `<h3>待确认问题</h3><div class="list">${insightCards(result.questions)}</div>` : ""}
            ${(result.evidence_notes || []).length ? `<h3>背景证据</h3><div class="list">${insightCards(result.evidence_notes)}</div>` : ""}
            <h3>风险提醒</h3>
            <div class="list">${result.risks.map((item) => `<div class="plain-card">${item}</div>`).join("")}</div>
          `;
          return;
        }

        content.innerHTML = `
          <h2 class="panel-title">全文转写</h2>
          ${(result.transcript || []).map((line) => `<div class="transcript-line">${line}</div>`).join("")}
        `;
      }

      markBtn.addEventListener("click", () => {
        markers.push({
          label: "重点标记",
          time: nextTimestamp(),
          note: markers.length % 2 === 0 ? "硬件按钮模拟：这里很重要" : "跟我相关的任务",
        });
        renderMarkers();
      });

      analyzeBtn.addEventListener("click", async () => {
        analyzeBtn.disabled = true;
        analyzeBtn.textContent = "分析中...";

        const formData = new FormData();
        const audio = document.querySelector("#audio").files[0];
        if (audio) formData.append("audio", audio);
        formData.append("transcript", document.querySelector("#transcript").value);
        const analysisUser = document.querySelector("#user").value.trim() || "王同学";
        formData.append("current_user", analysisUser);
        formData.append("markers", JSON.stringify(markers));

        try {
          const response = await fetch("/api/meetings/analyze", {
            method: "POST",
            body: formData,
          });
          result = await response.json();
          resultUser = analysisUser;
          render();
        } finally {
          analyzeBtn.disabled = false;
          analyzeBtn.textContent = "生成我的纪要";
        }
      });

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          activeTab = tab.dataset.tab;
          document.querySelectorAll(".tab").forEach((item) => item.classList.remove("active"));
          tab.classList.add("active");
          render();
        });
      });

      content.addEventListener("click", (event) => {
        const button = event.target.closest("[data-task-action]");
        if (!button) return;

        const action = button.dataset.taskAction;
        const key = button.dataset.taskKey;

        if (action === "confirm" || action === "ignore") {
          updateTaskStatus(key, action === "confirm" ? "已确认" : "已忽略");
          return;
        }

        if (action === "edit") {
          editingTaskKey = key;
          render();
          return;
        }

        if (action === "cancel-edit") {
          editingTaskKey = "";
          render();
          return;
        }

        if (action === "save") {
          const assignee = content.querySelector(`[data-edit-field="assignee"][data-task-key="${key}"]`)?.value || "待确认";
          const deadline = content.querySelector(`[data-edit-field="deadline"][data-task-key="${key}"]`)?.value || "待确认";
          updateTaskFields(key, { assignee, deadline, status: "已修改" });
        }
      });
    </script>
  </body>
</html>
